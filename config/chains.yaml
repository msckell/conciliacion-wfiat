# Written list of candidate networks. Only these are checked ("redes revisadas").
#
# in_scope: networks named in the published certificates, plus Arc (mainnet since 2026-09-16).
# The rest are probed for deployments only.
#
# rpc_urls are free public endpoints, tried in order. An env var RPC_URL_<KEY> goes first.
# explorer_api: free Blockscout or Etherscan style API used as a second source for logs.

chains:
  ethereum:
    name: Ethereum
    chain_id: 1
    in_scope: true
    rpc_urls:
      - https://ethereum-rpc.publicnode.com
      - https://eth.drpc.org
      - https://1rpc.io/eth
    explorer: https://etherscan.io
    explorer_api:
      - {kind: blockscout, url: https://eth.blockscout.com/api}
      - {kind: etherscan, url: https://api.etherscan.io/v2/api}

  base:
    name: Base
    chain_id: 8453
    in_scope: true
    rpc_urls:
      - https://base-rpc.publicnode.com
      - https://mainnet.base.org
      - https://base.drpc.org
      - https://1rpc.io/base
    explorer: https://basescan.org
    explorer_api:
      - {kind: blockscout, url: https://base.blockscout.com/api}

  polygon:
